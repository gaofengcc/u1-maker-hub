# Publishes the Docker image to GitHub Container Registry, so docker-compose.yml (and Portainer) can pull it.
# Make the package public once, in GitHub → Packages → u1-maker-hub → Package settings, so no login is needed to pull.
# OrcaSlicer currently ships only an x86_64 Linux AppImage, so this image targets amd64.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gaofengcc/u1-maker-hub
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=short,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # OrcaSlicer has no arm64 AppImage. See README.md for the emulation note.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
