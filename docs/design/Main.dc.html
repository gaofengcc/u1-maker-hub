<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explore models</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F7}
a{color:#0B7A45;text-decoration:none}a:hover{color:#075C33}
.card:hover{box-shadow:0 6px 20px rgba(17,24,39,.10);transform:translateY(-2px)}
.chip:hover{background:#E6E8EB}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #111827; min-height: 100vh; background: #F5F6F7">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E5E7EB; position: sticky; top: 0; z-index: 5">
    <div style="max-width: 1360px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; color: #111827">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z"></path><path d="m3 7 9 5 9-5"></path><path d="M12 12v10"></path></svg>
        <span style="font-weight: 700; font-size: 18px; letter-spacing: -0.01em">U1 Maker Hub</span>
      </a>
      <form style="flex: 1 1 360px; display: flex; min-width: 0" role="search">
        <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search MakerWorld</label>
        <div style="flex: 1; display: flex; align-items: center; gap: 8px; background: #F3F4F6; border: 1px solid #E5E7EB; border-radius: 999px; padding: 0 6px 0 16px; height: 44px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="q" type="search" value="{{query}}" onInput="{{onQuery}}" placeholder="Search MakerWorld models…" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 15px; outline: none; min-width: 0">
          <button type="submit" style="height: 34px; padding: 0 16px; border: 0; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Search</button>
        </div>
      </form>
      <nav style="display: flex; align-items: center; gap: 4px" aria-label="Main">
        <a href="Main.dc.html" style="padding: 10px 14px; border-radius: 8px; font-weight: 600; color: #111827; background: #F3F4F6">Explore</a>
        <a href="Printer.dc.html" style="padding: 10px 14px; border-radius: 8px; font-weight: 500; color: #4B5563">My printer</a>
      </nav>
      <a href="Printer.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 8px; border: 1px solid #E5E7EB; border-radius: 999px; color: #111827; min-height: 44px; box-sizing: border-box">
        <span style="width: 30px; height: 30px; border-radius: 999px; background: #E8F5EE; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="12" rx="1"></rect><path d="M8 21h8M12 15v6"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; line-height: 1.2">
          <span style="font-size: 13px; font-weight: 600">Snapmaker U1</span>
          <span style="font-size: 12px; color: #0B7A45">Printing · 42%</span>
        </span>
      </a>
    </div>
  </header>

  <main style="max-width: 1360px; margin: 0 auto; padding: 24px">

    <section style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px" aria-label="Categories">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="9">
        <button class="chip" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </section>

    <section style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px">
      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700">{{heading}}</h1>
        <span style="font-size: 14px; color: #6B7280">Results from MakerWorld</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #374151; min-height: 44px; cursor: pointer">
          <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: {{accent}}">
          Multi-color (fits 4 toolheads)
        </label>
        <label for="sort" style="font-size: 14px; color: #4B5563">Sort</label>
        <select id="sort" style="height: 40px; border: 1px solid #D1D5DB; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 14px; background: #FFFFFF">
          <option>Trending</option>
          <option>Most downloaded</option>
          <option>Newest</option>
          <option>Most liked</option>
        </select>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px" aria-label="Models">
      <sc-for list="{{models}}" as="m" hint-placeholder-count="12">
        <a class="card" href="Model.dc.html" style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 12px; overflow: hidden; color: #111827; border: 1px solid #ECEEF0; transition: box-shadow .15s, transform .15s">
          <div style="position: relative; aspect-ratio: 4 / 3; background: {{m.bg}}; display: flex; align-items: center; justify-content: center">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="{{m.fg}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z"></path><path d="m3 7 9 5 9-5"></path><path d="M12 12v10"></path></svg>
            <span style="position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.92); color: #374151">{{m.colors}} colors</span>
            <sc-if value="{{m.ready}}" hint-placeholder-val="{{ true }}">
              <span style="position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: #0B7A45; color: #FFFFFF">U1 preset ready</span>
            </sc-if>
          </div>
          <div style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 15px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{m.title}}</span>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #4B5563; min-width: 0">
                <span style="width: 20px; height: 20px; border-radius: 999px; background: {{m.fg}}; flex: none"></span>
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{m.creator}}</span>
              </span>
              <span style="display: flex; gap: 10px; font-size: 12px; color: #4B5563; flex: none">
                <span style="display: flex; align-items: center; gap: 3px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"></path></svg>{{m.dl}}</span>
                <span style="display: flex; align-items: center; gap: 3px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"></path></svg>{{m.likes}}</span>
              </span>
            </div>
            <span style="font-size: 12px; color: #4B5563">{{m.time}} on U1 · {{m.grams}}</span>
          </div>
        </a>
      </sc-for>
    </section>

    <div style="display: flex; justify-content: center; margin-top: 28px">
      <button style="height: 44px; padding: 0 28px; border: 1px solid #D1D5DB; border-radius: 999px; background: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">Load more</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A45","options":["#0B7A45","#1F6FEB","#E8590C","#111827"]},"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { cat: 'All', query: 'articulated dragon' }; }
  renderVals() {
    const accent = this.props.accent ?? '#0B7A45';
    const labels = ['All','Toys & Games','Household','Tools','Decor','Gadgets','Cosplay','Education','Multi-color'];
    const cats = labels.map((l) => {
      const on = l === this.state.cat;
      return { label: l, pick: () => this.setState({ cat: l }),
        style: 'height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid ' + (on ? '#111827' : '#E5E7EB') + '; background: ' + (on ? '#111827' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#374151') };
    });
    const tints = [['#E8F5EE','#0B7A45'],['#EAF1FD','#1F5FC4'],['#FDF0E6','#B4530A'],['#F3EEFB','#6B3FB5'],['#FCEBEE','#B4233C'],['#EEF2F3','#36505A']];
    const raw = [
      ['Articulated Crystal Dragon','Sample creator A','24.1k','8.3k','4h 12m','86 g',4,true],
      ['Flexi Rex, print-in-place','Sample creator B','18.7k','5.1k','1h 05m','22 g',1,true],
      ['Cable organizer, 6 slots','Sample creator C','9.4k','2.2k','38m','14 g',1,true],
      ['Low-poly planter, self-watering','Sample creator D','12.0k','3.9k','3h 40m','112 g',2,true],
      ['Mini chess set, 4-color','Sample creator E','6.8k','1.7k','5h 22m','74 g',4,false],
      ['Headphone stand, desk clamp','Sample creator F','15.3k','4.4k','2h 48m','96 g',1,true],
      ['Dice tower, castle','Sample creator G','7.1k','2.0k','6h 10m','140 g',3,false],
      ['Gridfinity baseplate 4×4','Sample creator H','31.5k','9.8k','1h 52m','58 g',1,true],
      ['Kids name keychain','Sample creator I','4.2k','1.1k','24m','6 g',2,true],
      ['Lithophane lamp shade','Sample creator J','8.9k','3.0k','7h 30m','120 g',1,false],
      ['Spool holder, ball bearing','Sample creator K','11.6k','2.7k','2h 02m','64 g',1,true],
      ['Toolhead mascot figurine','Sample creator L','3.3k','0.9k','3h 15m','41 g',4,true]
    ];
    const models = raw.map((r, i) => ({ title: r[0], creator: r[1], dl: r[2], likes: r[3], time: r[4], grams: r[5], colors: r[6], ready: r[7], bg: tints[i % 6][0], fg: tints[i % 6][1] }));
    return { accent, cats, models, query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      heading: this.state.cat === 'All' ? 'Trending models' : this.state.cat };
  }
}
</script>
</body>
</html>
